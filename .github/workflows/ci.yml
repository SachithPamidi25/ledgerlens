name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ledgerlens
          POSTGRES_USER: ledgerlens
          POSTGRES_PASSWORD: ledgerlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlens -d ledgerlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/ledgerlens
      DB_USERNAME: ledgerlens
      DB_PASSWORD: ledgerlens
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ledgerlens-receipts
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      ANTHROPIC_API_KEY: not-configured
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare database extensions
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U ledgerlens -d ledgerlens -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          docker exec "${{ job.services.postgres.id }}" psql -U ledgerlens -d ledgerlens -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ledgerlens-backend:ci .

      - name: Build frontend image
        run: docker build -t ledgerlens-frontend:ci ./frontend
